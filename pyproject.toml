[build-system]
requires = ["setuptools>=75.6.0", "setuptools_scm[toml]>=5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethpm-types"
description = "ethpm_types: Implementation of EIP-2678"
readme = "README.md"
dynamic = ["version"]
authors = [{ name = "ApeWorX Ltd.", email = "admin@apeworx.io" }]
license = { text = "Apache-2.0" }
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10,<4"
dependencies = [
    "pydantic>=2.9,<3",
    "eth-abi>=5.1.0,<6",
    "eth-utils>=2.1.0,<6",
    "py-cid>=0.3.0,<0.4",
    "requests>=2.32.3,<3",
    "eth-pydantic-types>=0.2.1,<0.3",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/ethpm-types"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
    "pytest-xdist",
    "pytest-cov",
    "hypothesis>=6.2.0,<7.0",
    "PyGithub>=1.54,<2.0",
    "hypothesis-jsonschema==0.19.0",
    "eth-hash[pysha3]",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.15.0,<2",
    "types-setuptools",
    "types-requests",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
doc = [
    "myst-parser>=1.0.0,<2",
    "sphinx-click>=4.4.0,<5",
    "Sphinx>=6.1.3,<7",
    "sphinx_rtd_theme>=1.2.0,<2",
    "sphinxcontrib-napoleon>=0.7",
]
release = [
    "setuptools>=75.6.0",
    "wheel",
    "twine",
]
dev = [
    "commitizen>=2.40,<2.41",
    "pre-commit",
    "pytest-watch",
    "IPython",
    "ipdb",
]

[tool.setuptools]
include-package-data = true
packages = ["ethpm_types"]
package-data = {"ethpm_types" = ["py.typed"]}

[tool.setuptools_scm]
write_to = "ethpm_types/version.py"

[tool.pytest.ini_options]
addopts = """
    -p no:ape_test
    -p no:pytest_ethereum
    --cov-branch
    --cov-report term
    --cov-report html
    --cov-report xml
    --cov=ethpm_types
"""
python_files = "test_*.py"
testpaths = "tests"
markers = "fuzzing: Run Hypothesis fuzz test suite"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [ "B", "C4", "E", "F", "FIX", "I", "RET", "S", "SIM", "T10", "TCH", "UP", "W"]
ignore = [
    "E501",
    "B904",
    "B006",
    "B007",
    "B012",
    "B028",
    "FIX002",
    "FIX004",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM116",
    "SIM117",
    "B018",
    "RET501",
    "RET502",
    "RET503",
    "RET504",
    "RET505",
    "RET506",
    "RET507",
    "RET508",
    "S101",
    "S102",
    "S105",
    "S110",
    "S112",
    "S113",
    "S202",
    "S307",
    "S311",
    "S603",
    "S607",
    "C416",
    "C408",
    "C417",
    "C414",
    "C401",
    "C409",
    "C419",
    "SIM101",
    "SIM103",
    "SIM110",
    "SIM118",
    "SIM401",
    "SIM910",
    "TC001",
    "TC003",
    "TC006",
    "UP028",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [ "D", "E501", "S101", "B011"]
"**/conftest.py" = ["F401", "F841"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["eth_pydantic_types"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
exclude = ["build"]
plugins = ["pydantic.mypy"]

[tool.mdformat]
number = true
